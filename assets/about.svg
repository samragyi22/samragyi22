<title id="t">About — system profile</title>
<desc id="d">AI-focused full-stack engineer with production experience across FinTech analytics, e-commerce and career-tech platforms, shipping features end-to-end using MERN, Next.js and modern AI tooling such as Claude SDK, MCP and Groq API. Based in Jaipur, India, open to opportunities, always learning. Core capabilities: AI engineering, full-stack development, production engineering, developer experience, problem solving. Timeline: 2025 AI and full-stack engineering, 2026 production software engineering, now building AI and full-stack systems.</desc>
