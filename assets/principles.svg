<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 172" width="880" height="172" role="img" aria-labelledby="t d">
<title id="t">Engineering principles</title>
<desc id="d">Ship production software: build things that actually reach users. Measure performance: use metrics to guide optimization. Build with AI, not around AI: treat AI as an engineering capability rather than decoration.</desc>
<defs>
  <linearGradient id="hg6" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#247BFF"/><stop offset="1" stop-color="#FF354F"/></linearGradient>
  <pattern id="gridF" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#0F1829" stroke-width="1"/></pattern>
</defs>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  .fade{animation:fade .6s ease-out backwards}
  .rise{animation:rise .7s cubic-bezier(.2,.7,.3,1) backwards}
  @keyframes fade{from{opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}}
  @media (prefers-reduced-motion:reduce){.fade,.rise{animation:none}}
</style>
<rect width="880" height="172" fill="#070B16"/>
<rect width="880" height="172" fill="url(#gridF)" opacity="0.75"/>
<rect x="0" y="0" width="880" height="172" fill="none" stroke="#17233A"/>
<g class="fade">
  <rect x="44" y="30" width="3" height="16" fill="url(#hg6)"/>
  <text class="mono" x="58" y="43" font-size="13" letter-spacing="3.2" font-weight="700" fill="#F5F7FA">ENGINEERING PRINCIPLES</text>
  <text class="mono" x="836" y="43" font-size="10" letter-spacing="2" fill="#44557A" text-anchor="end">HOW I WORK</text>
</g>
<g class="rise" style="animation-delay:.1s">
  <rect x="44" y="62" width="254" height="86" rx="10" fill="#0B1222" stroke="#1B2B45"/>
  <text class="mono" x="60" y="84" font-size="10" letter-spacing="1.8" fill="#247BFF">01</text>
  <text class="mono" x="60" y="106" font-size="11.5" letter-spacing="0.8" font-weight="700" fill="#F5F7FA">SHIP PRODUCTION SOFTWARE</text>
  <text class="mono" x="60" y="124" font-size="9.5" fill="#A9B6CC">Build things that actually</text>
  <text class="mono" x="60" y="138" font-size="9.5" fill="#A9B6CC">reach users.</text>
</g>
<g class="rise" style="animation-delay:.2s">
  <rect x="313" y="62" width="254" height="86" rx="10" fill="#0B1222" stroke="#1B2B45"/>
  <text class="mono" x="329" y="84" font-size="10" letter-spacing="1.8" fill="#247BFF">02</text>
  <text class="mono" x="329" y="106" font-size="11.5" letter-spacing="0.8" font-weight="700" fill="#F5F7FA">MEASURE PERFORMANCE</text>
  <text class="mono" x="329" y="124" font-size="9.5" fill="#A9B6CC">Use metrics to guide</text>
  <text class="mono" x="329" y="138" font-size="9.5" fill="#A9B6CC">optimization.</text>
</g>
<g class="rise" style="animation-delay:.3s">
  <rect x="582" y="62" width="254" height="86" rx="10" fill="#0B1222" stroke="#1B2B45"/>
  <text class="mono" x="598" y="84" font-size="10" letter-spacing="1.8" fill="#FF354F">03</text>
  <text class="mono" x="598" y="106" font-size="11.5" letter-spacing="0.8" font-weight="700" fill="#F5F7FA">BUILD WITH AI, NOT AROUND IT</text>
  <text class="mono" x="598" y="124" font-size="9.5" fill="#A9B6CC">AI as an engineering</text>
  <text class="mono" x="598" y="138" font-size="9.5" fill="#A9B6CC">capability, not decoration.</text>
</g>
</svg>
