<style>.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.disp{font-family:"Helvetica Neue",Helvetica,Arial,"Segoe UI",Roboto,sans-serif}.fade{animation:fade .6s ease-out backwards}.rise{animation:rise .7s cubic-bezier(.2,.7,.3,1) backwards}@keyframes fade{from{opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(10px)}}@media (prefers-reduced-motion:reduce){.fade,.rise{animation:none}}</style>
<rect width="880" height="116" fill="#070B16"/><rect width="880" height="116" fill="url(#gridM)" opacity="0.75"/>
