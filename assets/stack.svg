  <clipPath id="frame"><rect x="0" y="0" width="880" height="416" rx="2"/></clipPath>
</defs>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  .fade{animation:fade .6s ease-out backwards}
  .chip{animation:chip .55s cubic-bezier(.2,.7,.3,1) backwards}
  @keyframes fade{from{opacity:0}}
  @keyframes chip{from{opacity:0;transform:translateY(8px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinR{to{transform:rotate(-360deg)}}
  .o1{transform-origin:812px 215px;animation:spin 70s linear infinite}
  .o2{transform-origin:812px 215px;animation:spinR 48s linear infinite}
  .o3{transform-origin:68px 340px;animation:spin 56s linear infinite}
  @media (prefers-reduced-motion:reduce){.fade,.chip,.o1,.o2,.o3{animation:none}}
</style>
