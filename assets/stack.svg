<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 416" width="880" height="416" role="img" aria-labelledby="t d">
<title id="t">Tech stack</title>
<desc id="d">Languages: Java, JavaScript, TypeScript, Python, SQL. AI and agentic: Claude SDK, MCP, Groq API. Frontend: React, Next.js, Vite, Tailwind, Redux Toolkit. Backend and APIs: Django, Django Ninja, DRF, Node.js, Express, GraphQL, REST, Celery. Databases: PostgreSQL, MongoDB, ClickHouse, DuckDB, Redis, Typesense, pgvector. DevOps and testing: Docker, AWS, GitHub Actions, Pytest, Jest, Playwright, Git, Postman.</desc>
<defs>
