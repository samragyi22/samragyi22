<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 244" width="880" height="244" role="img" aria-labelledby="t d">
<title id="t">Featured projects</title>
<desc id="d">SCORIK, an AI-powered career and resume intelligence platform with 95 percent ATS pass rate, 50 plus ATS-optimized templates and Groq llama-3.3-70b analysis, built with React 18, Vite and Tailwind. AI FinTech Analytics, natural-language financial analytics with AI tool calling using Claude Haiku 4.5 and MCP, SQL and Python analysis, streaming AI responses, on Next.js 16. HackTok, a dual-database MERN platform for sharing life hacks using MongoDB and PostgreSQL with 50 plus weekly users.</desc>
<defs>
  <linearGradient id="hg4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1668E3"/><stop offset="1" stop-color="#D81E36"/></linearGradient>
  <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1668E3"/><stop offset="1" stop-color="#1668E3" stop-opacity="0.15"/></linearGradient>
  <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3F77DE"/><stop offset="1" stop-color="#3F77DE" stop-opacity="0.15"/></linearGradient>
  <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D81E36"/><stop offset="1" stop-color="#D81E36" stop-opacity="0.15"/></linearGradient>
  <radialGradient id="g4" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#1668E3" stop-opacity="0.06"/><stop offset="1" stop-color="#1668E3" stop-opacity="0"/></radialGradient>
  <pattern id="gridD" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#EFF4FB" stroke-width="1"/></pattern>
</defs>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  .disp{font-family:"Helvetica Neue",Helvetica,Arial,"Segoe UI",Roboto,sans-serif}
  .fade{animation:fade .6s ease-out backwards}
  .rise{animation:rise .7s cubic-bezier(.2,.7,.3,1) backwards}
  .bar{transform-origin:0 0;animation:grow .9s cubic-bezier(.2,.7,.3,1) backwards}
  @keyframes fade{from{opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}}
  @keyframes grow{from{transform:scaleX(0)}}
  @media (prefers-reduced-motion:reduce){.fade,.rise,.bar{animation:none}}
</style>
