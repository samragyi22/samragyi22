<style>
  :root{--bg:#ffffff;--panel:#f6f8fa;--border:#d1d9e0;--text:#1f2328;--muted:#59636e;--link:#0969da}
  @media (prefers-color-scheme:dark){
    :root{--bg:#0d1117;--panel:#010409;--border:#3d444d;--text:#f0f6fc;--muted:#9198a1;--link:#4493f8}
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6}

  .chrome i{width:9px;height:9px;border-radius:50%;background:var(--border);display:inline-block}
  .readme{border:1px solid var(--border);border-radius:0 0 8px 8px;background:var(--bg);padding:22px 26px 30px}
  img{max-width:100%;height:auto}
  .hero{display:block}
  .ctr{text-align:center;margin:16px 0 0;font-size:0}
  .ctr a{display:inline-block;margin:0 2px}
  .links{text-align:center;margin:14px 0 0;font-size:15px}
  a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
  .foot{color:var(--muted);font-size:12px;margin-top:20px;

</style>
